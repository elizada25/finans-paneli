name: BIST 30 Gunluk Sanal Robot

on:
  schedule:
    - cron: '*/5 7-14 * * 1-5'
    - cron: '0-10/5 15 * * 1-5'
  workflow_dispatch:

concurrency:
  group: sky-bist-paper-robot
  cancel-in-progress: false

jobs:
  run-paper-robot:
    runs-on: ubuntu-latest

    steps:
      - name: BIST sanal robotu kontrol et
        run: |
          curl --fail-with-body \
            --retry 2 \
            --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.ALERT_CRON_SECRET }}" \
            "https://finans-paneli-amber.vercel.app/api/alerts/bist-paper-robot"
