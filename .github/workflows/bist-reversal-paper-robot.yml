name: BIST Donus Radari Sanal Robot

on:
  schedule:
    - cron: '*/15 15-18 * * 1-5'
  workflow_dispatch:

concurrency:
  group: sky-bist-reversal-paper-robot
  cancel-in-progress: false

jobs:
  run-reversal-robot:
    runs-on: ubuntu-latest
    steps:
      - name: Dönüş radarı sanal robotunu kontrol et
        run: |
          curl --fail-with-body --retry 2 --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.ALERT_CRON_SECRET }}" \
            "https://finans-paneli-amber.vercel.app/api/alerts/bist-reversal-paper-robot"
