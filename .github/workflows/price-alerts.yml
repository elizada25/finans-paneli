name: Sky Finans Fiyat Alarmları

on:
  schedule:
    - cron: '*/15 * * * 1-5'
  workflow_dispatch:

jobs:
  check-price-alerts:
    runs-on: ubuntu-latest

    steps:
      - name: Sky Finans alarm motorunu çalıştır
        run: |
          curl --fail-with-body \
            --retry 2 \
            --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.ALERT_CRON_SECRET }}" \
            "https://finans-paneli-amber.vercel.app/api/alerts/check"
