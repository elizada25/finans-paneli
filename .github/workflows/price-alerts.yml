name: Sky Finans Akıllı Alarmlar V3

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: sky-finans-smart-alerts
  cancel-in-progress: false

jobs:
  check-smart-alerts:
    runs-on: ubuntu-latest

    steps:
      - name: Fiyat alarmlarını kontrol et
        run: |
          day="$(TZ=Europe/Istanbul date +%u)"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$day" -le 5 ]; then
            curl --fail-with-body \
              --retry 2 \
              --max-time 120 \
              -H "Authorization: Bearer ${{ secrets.ALERT_CRON_SECRET }}" \
              "https://finans-paneli-amber.vercel.app/api/alerts/check"
          else
            echo "Hafta sonu: fiyat kontrolü atlandı."
          fi

      - name: Haber alarmlarını kontrol et
        run: |
          curl --fail-with-body \
            --retry 2 \
            --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.ALERT_CRON_SECRET }}" \
            "https://finans-paneli-amber.vercel.app/api/alerts/news"

      - name: Hacim teknik ve portföy alarmlarını kontrol et
        run: |
          day="$(TZ=Europe/Istanbul date +%u)"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$day" -le 5 ]; then
            curl --fail-with-body \
              --retry 2 \
              --max-time 120 \
              -H "Authorization: Bearer ${{ secrets.ALERT_CRON_SECRET }}" \
              "https://finans-paneli-amber.vercel.app/api/alerts/smart"
          else
            echo "Hafta sonu: teknik ve portföy kontrolü atlandı."
          fi

  test-news-link:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Haber bağlantısı testi gönder
        run: |
          curl --fail-with-body \
            --retry 2 \
            --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.ALERT_CRON_SECRET }}" \
            "https://finans-paneli-amber.vercel.app/api/test-news-link"
